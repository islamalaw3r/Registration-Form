<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <form action="/register" method="POST" enctype="multipart/form-data">

        <!-- Personal Information -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text"
                   id="fullname"
                   name="fullname"
                   placeholder="Enter your full name"
                   required
                   minlength="3"
                   maxlength="50">
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@gmail.com"
                   required>
            <br><br>

            <label for="password">Password:</label><br>
            <input type="password"
                   id="password"
                   name="password"
                   minlength="8"
                   placeholder="Minimum 8 characters"
                   required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel"
                   id="phone"
                   name="phone"
                   placeholder="059-123-4567"
                   pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                   required>
            <br><br>

            <label for="birthdate">Date of Birth:</label><br>
            <input type="date"
                   id="birthdate"
                   name="birthdate"
                   required>
            <br><br>

        </fieldset>

        <br>

        <!-- Academic Information -->
        <fieldset>
            <legend>Academic Information</legend>

            <label for="major">Major:</label><br>
            <select id="major" name="major" required>
                <option value="">-- Select Major --</option>
                <option value="computer-engineering">Computer Engineering</option>
                <option value="computer-science">Computer Science</option>
                <option value="information-technology">Information Technology</option>
                <option value="software-engineering">Software Engineering</option>
            </select>

            <br><br>

            <label for="level">Academic Level:</label><br>
            <select id="level" name="level">
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
            </select>

        </fieldset>

        <br>

        <!-- Gender -->
        <fieldset>
            <legend>Gender</legend>

            <input type="radio"
                   id="male"
                   name="gender"
                   value="male"
                   required>

            <label for="male">Male</label>

            <input type="radio"
                   id="female"
                   name="gender"
                   value="female">

            <label for="female">Female</label>

        </fieldset>

        <br>

        <!-- Skills -->
        <fieldset>
            <legend>Programming Skills</legend>

            <input type="checkbox"
                   id="html"
                   name="skills"
                   value="html">

            <label for="html">HTML</label><br>

            <input type="checkbox"
                   id="css"
                   name="skills"
                   value="css">

            <label for="css">CSS</label><br>

            <input type="checkbox"
                   id="javascript"
                   name="skills"
                   value="javascript">

            <label for="javascript">JavaScript</label><br>

            <input type="checkbox"
                   id="python"
                   name="skills"
                   value="python">

            <label for="python">Python</label><br>

            <input type="checkbox"
                   id="java"
                   name="skills"
                   value="java">

            <label for="java">Java</label>

        </fieldset>

        <br>

        <!-- Range -->
        <fieldset>
            <legend>Programming Experience</legend>

            <label for="experience">
                Rate your programming experience (1 - 10):
            </label>
            <br>

            <input type="range"
                   id="experience"
                   name="experience"
                   min="1"
                   max="10"
                   value="5">

        </fieldset>

        <br>

        <!-- File Upload -->
        <fieldset>
            <legend>Upload Profile Photo</legend>

            <label for="photo">Choose Photo:</label><br>

            <input type="file"
                   id="photo"
                   name="photo"
                   accept="image/*">

        </fieldset>

        <br>

        <!-- About Yourself -->
        <fieldset>
            <legend>About Yourself</legend>

            <label for="bio">Short Biography:</label><br>

            <textarea id="bio"
                      name="bio"
                      rows="6"
                      cols="50"
                      maxlength="300"
                      placeholder="Write something about yourself..."></textarea>

        </fieldset>

        <br>

        <!-- Terms -->
        <input type="checkbox"
               id="terms"
               name="terms"
               required>

        <label for="terms">
            I agree to the Terms and Conditions
        </label>

        <br><br>

        <!-- Buttons -->
        <button type="submit">Register</button>

        <button type="reset">Clear Form</button>

    </form>

</body>
</html>
